<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6d28d9" />
      <stop offset="50%" stop-color="#1e1b8f" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Background rounded square -->
  <rect width="512" height="512" rx="128" fill="#07060d" />
  
  <!-- Subtle background glow -->
  <circle cx="260" cy="240" r="160" fill="url(#brandGrad)" opacity="0.25" filter="url(#glow)" />

  <!-- Circuit nodes on left -->
  <g stroke="#06b6d4" stroke-width="8" stroke-linecap="round">
    <path d="M 120 230 L 175 230" />
    <circle cx="112" cy="230" r="12" fill="#07060d" stroke="#06b6d4" stroke-width="8" />

    <path d="M 90 280 L 155 280" />
    <circle cx="82" cy="280" r="12" fill="#07060d" stroke="#06b6d4" stroke-width="8" />

    <path d="M 130 330 L 175 330" />
    <circle cx="122" cy="330" r="12" fill="#07060d" stroke="#06b6d4" stroke-width="8" />
  </g>

  <!-- Main 'A' / Play Triangle Shape -->
  <path d="M 235 90 C 248 70 274 70 287 90 L 415 285 C 428 305 414 332 390 332 L 320 332 L 300 290 L 210 290 L 160 380 C 148 402 120 405 104 388 C 88 372 92 344 106 322 Z" fill="url(#brandGrad)" />

  <!-- Play icon forward slant / cut -->
  <path d="M 262 105 L 398 290 C 408 304 398 320 380 320 L 290 320 L 262 105 Z" fill="url(#purpleGlow)" opacity="0.9" />

  <!-- Sparkle / Star in top apex -->
  <path d="M 262 125 Q 262 165 240 165 Q 262 165 262 205 Q 262 165 284 165 Q 262 165 262 125 Z" fill="#ffffff" filter="url(#glow)" />

  <!-- Browser / Ad window card on lower right -->
  <g transform="translate(230, 245)">
    <!-- Window Body -->
    <rect x="0" y="0" width="165" height="110" rx="14" fill="#07060d" stroke="#06b6d4" stroke-width="8" />
    <path d="M 0 0 H 165 V 32 H 0 Z" fill="#06b6d4" />
    <!-- Window Dots -->
    <circle cx="22" cy="16" r="4.5" fill="#ffffff" />
    <circle cx="38" cy="16" r="4.5" fill="#ffffff" opacity="0.8" />
    <circle cx="54" cy="16" r="4.5" fill="#ffffff" opacity="0.8" />
    <!-- Inner Ad Content mockup -->
    <rect x="18" y="46" width="60" height="48" rx="6" fill="#06b6d4" />
    <rect x="88" y="48" width="60" height="10" rx="4" fill="#6d28d9" />
    <rect x="88" y="66" width="45" height="8" rx="4" fill="#6d28d9" opacity="0.6" />
    <rect x="88" y="82" width="55" height="8" rx="4" fill="#06b6d4" opacity="0.8" />
  </g>

  <!-- Ambient Sparkles -->
  <!-- Top Left Purple Sparkle -->
  <path d="M 180 140 Q 180 155 165 155 Q 180 155 180 170 Q 180 155 195 155 Q 180 155 180 140 Z" fill="#8b5cf6" />
  <!-- Top Right Cyan Sparkle -->
  <path d="M 360 145 Q 360 160 345 160 Q 360 160 360 175 Q 360 160 375 160 Q 360 160 360 145 Z" fill="#06b6d4" />
</svg>
