<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07060d" />
      <stop offset="40%" stop-color="#0e0c20" />
      <stop offset="100%" stop-color="#07060d" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6d28d9" />
      <stop offset="50%" stop-color="#1e1b8f" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="80" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Ambient Glows -->
  <circle cx="1050" cy="150" r="280" fill="#6d28d9" opacity="0.3" filter="url(#blurFilter)" />
  <circle cx="200" cy="500" r="240" fill="#06b6d4" opacity="0.25" filter="url(#blurFilter)" />

  <!-- Tech Grid Overlay -->
  <path d="M 0 100 H 1200 M 0 200 H 1200 M 0 300 H 1200 M 0 400 H 1200 M 0 500 H 1200" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1" />
  <path d="M 200 0 V 630 M 400 0 V 630 M 600 0 V 630 M 800 0 V 630 M 1000 0 V 630" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1" />

  <!-- Outer Glass Frame -->
  <rect x="40" y="40" width="1120" height="550" rx="24" fill="#0f0e1a" fill-opacity="0.6" stroke="#1c1a30" stroke-width="2" />

  <!-- Header Badge -->
  <g transform="translate(80, 85)">
    <rect width="360" height="42" rx="21" fill="#6d28d9" fill-opacity="0.25" stroke="#06b6d4" stroke-width="1.5" />
    <circle cx="24" cy="21" r="5" fill="#06b6d4" />
    <text x="38" y="26" fill="#f4f2fb" font-family="'Sora', sans-serif" font-size="14" font-weight="600" letter-spacing="1">24-Hour Rapid Production</text>
  </g>

  <!-- Brand Mark Icon on Right -->
  <g transform="translate(900, 100)">
    <rect width="180" height="180" rx="40" fill="#07060d" stroke="#6d28d9" stroke-width="3" />
    <path d="M 90 30 L 140 120 C 145 130 138 142 126 142 L 54 142 C 42 142 35 130 40 120 Z" fill="url(#accentGrad)" />
    <circle cx="90" cy="85" r="14" fill="#ffffff" />
  </g>

  <!-- English Title -->
  <text x="80" y="260" fill="#ffffff" font-family="'Sora', sans-serif" font-size="52" font-weight="800" letter-spacing="-1">
    AI Ad Maker Telugu
  </text>

  <!-- Subtitle -->
  <text x="80" y="340" fill="#a1a1aa" font-family="'Sora', sans-serif" font-size="24" font-weight="400">
    24-Hour AI Video Ads, Posters, Reels & Websites for Commercial Growth
  </text>

  <!-- Highlights / Badges -->
  <g transform="translate(80, 400)">
    <rect width="210" height="36" rx="8" fill="#1e1b8f" fill-opacity="0.4" stroke="#6d28d9" stroke-width="1" />
    <text x="14" y="23" fill="#06b6d4" font-family="'Sora', sans-serif" font-size="14" font-weight="600">⚡ 24-HOUR DELIVERY</text>
  </g>
  <g transform="translate(305, 400)">
    <rect width="190" height="36" rx="8" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-width="1" />
    <text x="14" y="23" fill="#38bdf8" font-family="'Sora', sans-serif" font-size="14" font-weight="600">💰 FROM ₹300 / AD</text>
  </g>
  <g transform="translate(510, 400)">
    <rect width="210" height="36" rx="8" fill="#6d28d9" fill-opacity="0.3" stroke="#a855f7" stroke-width="1" />
    <text x="14" y="23" fill="#e9d5ff" font-family="'Sora', sans-serif" font-size="14" font-weight="600">🎁 5 FREE ADS OFFER</text>
  </g>

  <!-- Footer Metadata -->
  <g transform="translate(80, 500)">
    <text x="0" y="24" fill="#f4f2fb" font-family="'Sora', sans-serif" font-size="20" font-weight="700">AI AD MAKER TELUGU</text>
    <text x="0" y="48" fill="#71717a" font-family="'Sora', sans-serif" font-size="15">Instagram: @ai_ad_maker_telugu · Delivery in 24 Hours</text>
  </g>
</svg>